<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A personal portfolio website for Khanh, a designer and aspiring coder.">
    <meta name="keywords" content="designer, portfolio, coding, RMIT, digital media">
    <title>Sound design</title>
    <link rel="stylesheet" href="css/stylesss.css">
    <link rel="stylesheet" href="css/fonts.css">
    <link href="https://fonts.googleapis.com/css2?family=Anonymous+Pro:wght@700&display=swap" rel="stylesheet">
</head>

<body>
    <header>
        <a class="site-logo" href="index.html" aria-label="Go to Home page"><img src="assets/images/logo.png" alt=""></a>
        <button id="hamburger-menu">
            <img src="assets/images/back.png" alt="Menu" id="hamburger-icon">
        </button>
        <nav>
            <ul id="nav-menu"> 
                <li><a href="index.html">HOME</a></li>
                <li><a href="about.html">ABOUT</a></li>
                <li><a href="works.html">WORKS</a></li>
                <li><a href="contact.html" id="contact-link" class="nav-link">CONTACT</a></li>
            </ul>
        </nav>
    </header>

    <main class="works-container">
        <div class="work-item">
            <div class="work-grid">
                <div class="decor1">
                    <img class="bom-image" src="assets/images/bom.png" alt="The Boogeyman">
                    <img class="oval-image" src="assets/images/ovalsoundblue.png" alt="Oval Sound">
                    <img class="yellow-background-image" src="assets/images/background_yellow.png" alt="yellow-background Sound">
                    <img class="bling-boogey-image" src="assets/images/blingsound.png" alt="bling Sound">
                </div>
                <div class="project1">
                    <a href="TheBoogeyman.html">
                        <img class="boogeyman-image" src="assets/images/boogeyman.JPG" alt="The Boogeyman">
                    </a>
                </div>
                <div class="work-text">The Boogeyman</div>
            </div>
        </div>
        
        <div class="work-item">
            <div class="work-grid">
                <div class="decor2">
                    <img class="chandong-image" src="assets/images/chan dong.png" alt="chandong-image">
                    <img class="oval2-image" src="assets/images/ovalsoundred.png" alt="Oval Sound">
                    <img class="blue-background-image" src="assets/images/background_blue.png" alt="blue-background Sound">
                    <img class="flowersound-image" src="assets/images/flowersound.png" alt="flower Sound">
                    <img class="bling-birthday-image" src="assets/images/blingsound.png" alt="bling2 Sound">
                </div>
                <div class="project2">
                    <a href="happybirthday.html">
                        <img class="happybirthday-image" src="assets/images/poster.png" alt="Happy Birthday">
                    </a>
                    
                </div>
                <div class="work-text">Happy Birthday</div>
            </div>
        </div>
        
        
    </main>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const boogeymanImage = document.querySelector('.boogeyman-image');
            const bomImage = document.querySelector('.bom-image');
    
            boogeymanImage.addEventListener('mouseenter', () => {
                bomImage.style.transform = 'scale(0.5)'; // Phóng to từ scale 0 lên scale 0.5
            });
    
            boogeymanImage.addEventListener('mouseleave', () => {
                bomImage.style.transform = 'scale(0)'; // Thu nhỏ về scale 0 khi rời chuột
            });
        });
    
        document.addEventListener('DOMContentLoaded', () => {
    const boogeymanImage = document.querySelector('.boogeyman-image');
    const ovalImage = document.querySelector('.oval-image');

    boogeymanImage.addEventListener('mouseover', () => {
        ovalImage.style.opacity = '1';
    });

    boogeymanImage.addEventListener('mouseout', () => {
        ovalImage.style.opacity = '0';
    });   
});
</script>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const happyBirthdayImage = document.querySelector('.happybirthday-image');
        const oval2Image = document.querySelector('.oval2-image');

        if (happyBirthdayImage && oval2Image) {
            // Hover vào happybirthday-image
            happyBirthdayImage.addEventListener('mouseover', () => {
                oval2Image.style.opacity = '1';
            });

            // Rời chuột khỏi happybirthday-image
            happyBirthdayImage.addEventListener('mouseout', () => {
                oval2Image.style.opacity = '0';
            });
        } else {
            console.error("Không tìm thấy phần tử .happybirthday-image hoặc .oval2-image");
        }
    });
</script>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const happyBirthdayImage = document.querySelector('.happybirthday-image');
        const flowerSoundImage = document.querySelector('.flowersound-image');

        happyBirthdayImage.addEventListener('mouseover', () => {
            flowerSoundImage.style.opacity = '1';
            flowerSoundImage.style.transform = 'scale(0.4) rotate(360deg)';
        });

        happyBirthdayImage.addEventListener('mouseout', () => {
            flowerSoundImage.style.opacity = '0';
            flowerSoundImage.style.transform = 'scale(0.4) rotate(0deg)';
        });
    });
</script>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const happyBirthdayImage = document.querySelector('.happybirthday-image');
        const blingBirthdayImage = document.querySelector('.bling-birthday-image');

        happyBirthdayImage.addEventListener('mouseover', () => {
            blingBirthdayImage.style.opacity = '1';
            blingBirthdayImage.style.transform = 'translateY(0) scale(0.25) scaleX(-1)';
        });

        happyBirthdayImage.addEventListener('mouseout', () => {
            blingBirthdayImage.style.opacity = '0';
            blingBirthdayImage.style.transform = 'translateY(2em) scale(0.25) scaleX(-1)';
        });
    });
</script>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const happyBirthdayImage = document.querySelector('.happybirthday-image');
        const chandongImage = document.querySelector('.chandong-image');

        happyBirthdayImage.addEventListener('mouseover', () => {
            chandongImage.style.opacity = '1';
        });

        happyBirthdayImage.addEventListener('mouseout', () => {
            chandongImage.style.opacity = '0';
        });
    });
</script>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const happyBirthdayImage = document.querySelector('.happybirthday-image');
        const blueBackgroundImage = document.querySelector('.blue-background-image');

        happyBirthdayImage.addEventListener('mouseover', () => {
            blueBackgroundImage.style.transform = 'translate(0.25em,0.25em)'; // Di chuyển đường chéo
            blueBackgroundImage.style.opacity = '1'; // Hiện background nếu đang ẩn
        });

        happyBirthdayImage.addEventListener('mouseout', () => {
            blueBackgroundImage.style.transform = 'translate(-1em, -1em)'; // Trở lại vị trí ban đầu
            blueBackgroundImage.style.opacity = '1'; // Giữ background hiện
        });
    });
</script>

<script>
    const hamburgerMenu = document.getElementById('hamburger-menu');
    const hamburgerIcon = document.getElementById('hamburger-icon'); // Icon bên trong nút
    const navMenu = document.getElementById('nav-menu');
    const navLinks = document.querySelectorAll('#nav-menu a');
    
    // Toggle menu
    hamburgerMenu.addEventListener('click', () => {
        navMenu.classList.toggle('show');
        hamburgerMenu.classList.toggle('active');
        document.body.style.overflow = navMenu.classList.contains('show') ? 'hidden' : 'auto';
    
        // Đổi hình ảnh
        if (hamburgerIcon.src.includes('assets/images/back.png')) {
            hamburgerIcon.src = 'assets/images/unlock.png'; // Đổi thành assets/images/unlock.png khi menu mở
        } else {
            hamburgerIcon.src = 'assets/images/back.png'; // Đổi lại thành assets/images/back.png khi menu đóng
        }
    
        console.log('Menu toggled'); // Debug
    });
    
    // Đóng menu khi click bên ngoài
    document.addEventListener('click', (event) => {
        if (!hamburgerMenu.contains(event.target) && !navMenu.contains(event.target)) {
            navMenu.classList.remove('show');
            hamburgerMenu.classList.remove('active');
            document.body.style.overflow = 'auto';
    
            // Reset hình ảnh về assets/images/back.png khi menu đóng
            hamburgerIcon.src = 'assets/images/back.png';
    
            console.log('Clicked outside menu'); // Debug
        }
    });
    
    // Đóng menu khi click vào link
    navLinks.forEach((link) => {
        link.addEventListener('click', () => {
            navMenu.classList.remove('show');
            hamburgerMenu.classList.remove('active');
            document.body.style.overflow = 'auto';
    
            // Reset hình ảnh về assets/images/back.png khi menu đóng
            hamburgerIcon.src = 'assets/images/back.png';
    
            console.log('Link clicked, menu closed'); // Debug
        });
    });
    
    document.addEventListener('DOMContentLoaded', () => {
const items = [
    { image: '.ear-image', text: '.work-text:nth-of-type(1)', link: 'sound_design.html' },
    { image: '.camera-image', text: '.work-text:nth-of-type(2)', link: 'contentcreator.html' },
    { image: '.web-image', text: '.work-text:nth-of-type(3)', link: 'web.html' },
    { image: '.illustration-image', text: '.work-text:nth-of-type(4)', link: 'illustration.html' },
];

items.forEach(({ image, text, link }) => {
    const imageEl = document.querySelector(image);
    const textEl = document.querySelector(text);

    // Hiển thị chữ khi nhấn vào ảnh (touchstart hoặc click)
    imageEl.addEventListener('click', () => {
        const isVisible = textEl.style.opacity === '1';

        // Nếu chữ đang hiển thị, ẩn chữ và điều hướng
        if (isVisible) {
            window.location.href = link;
        } else {
            // Hiển thị chữ
            textEl.style.opacity = '1';
            textEl.classList.add('glow');
            setTimeout(() => {
                textEl.style.opacity = '0';
                textEl.classList.remove('glow');
            }, 2000); // Ẩn chữ sau 2 giây
        }
    });

    // Ẩn chữ khi nhấn bên ngoài ảnh
    document.addEventListener('click', (e) => {
        if (!imageEl.contains(e.target) && !textEl.contains(e.target)) {
            textEl.style.opacity = '0';
            textEl.classList.remove('glow');
        }
    });
});
});

        </script>
</body>

</html>
