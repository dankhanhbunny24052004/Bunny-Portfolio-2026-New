<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Contact Khanh">
    <title>Contact</title>
    <link rel="stylesheet" href="css/contact.css">
    <link rel="stylesheet" href="css/fonts.css">
    <script src="js/page-transition.js" defer></script>
</head>
<body class="contact-page">
    <header>
        <a class="site-logo" href="index.html" aria-label="Go to Home page"><img src="assets/images/logo.png" alt=""></a>
        <button id="hamburger-menu" type="button" aria-label="Open navigation"><img src="assets/images/back.png" alt="" id="hamburger-icon"></button>
        <nav>
            <ul id="nav-menu">
                <li><a href="index.html">HOME</a></li>
                <li><a href="about.html">ABOUT</a></li>
                <li><a href="works.html">WORKS</a></li>
                <li><a href="contact.html" aria-current="page">CONTACT</a></li>
            </ul>
        </nav>
    </header>
    <main class="contact-stage" aria-label="Contact">
        <div class="contact-drop"><img class="contact-art" src="assets/images/contact.svg" alt="Illustrated hanging telephone"></div>
    </main>
    <script>
        const hamburgerMenu = document.getElementById('hamburger-menu');
        const hamburgerIcon = document.getElementById('hamburger-icon');
        const navMenu = document.getElementById('nav-menu');
        hamburgerMenu.addEventListener('click', () => {
            const isOpen = navMenu.classList.toggle('show');
            hamburgerMenu.classList.toggle('active', isOpen);
            document.body.classList.toggle('menu-open', isOpen);
            hamburgerIcon.src = isOpen ? 'assets/images/unlock.png' : 'assets/images/back.png';
        });
        document.addEventListener('click', (event) => {
            if (!hamburgerMenu.contains(event.target) && !navMenu.contains(event.target)) {
                navMenu.classList.remove('show');
                hamburgerMenu.classList.remove('active');
                document.body.classList.remove('menu-open');
                hamburgerIcon.src = 'assets/images/back.png';
            }
        });
    </script>
</body>
</html>
