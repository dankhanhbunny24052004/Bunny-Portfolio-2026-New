<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="3D projects by Bunny.">
    <title>3D Projects</title>
    <link rel="stylesheet" href="css/style3d.css">
    <link rel="stylesheet" href="css/fonts.css">
    <script src="js/page-transition.js" defer></script>
</head>

<body>
    <header>
        <a class="site-logo" href="index.html" aria-label="Go to Home page"><img src="assets/images/logo.png" alt=""></a>
        <button id="hamburger-menu" type="button" aria-label="Toggle navigation" aria-expanded="false">
            <img src="assets/images/back.png" alt="">
        </button>
        <nav>
            <ul id="nav-menu">
                <li><a href="index.html">HOME</a></li>
                <li><a href="about.html">ABOUT</a></li>
                <li><a href="works.html">WORKS</a></li>
                <li><a href="contact.html">CONTACT</a></li>
            </ul>
        </nav>
    </header>

    <main class="three-d-stage" aria-label="3D projects">
        <img class="ipod-intro" src="assets/images/ipod.svg" alt="Illustrated iPod">
    </main>

    <script>
        const hamburgerMenu = document.getElementById('hamburger-menu');
        const hamburgerIcon = hamburgerMenu.querySelector('img');
        const navMenu = document.getElementById('nav-menu');
        const navLinks = navMenu.querySelectorAll('a');

        const closeMenu = () => {
            navMenu.classList.remove('show');
            hamburgerMenu.classList.remove('active');
            hamburgerMenu.setAttribute('aria-expanded', 'false');
            hamburgerIcon.src = 'assets/images/back.png';
            document.body.style.overflow = '';
        };

        hamburgerMenu.addEventListener('click', () => {
            const isOpen = navMenu.classList.toggle('show');
            hamburgerMenu.classList.toggle('active', isOpen);
            hamburgerMenu.setAttribute('aria-expanded', String(isOpen));
            hamburgerIcon.src = isOpen ? 'assets/images/unlock.png' : 'assets/images/back.png';
            document.body.style.overflow = isOpen ? 'hidden' : '';
        });

        document.addEventListener('click', (event) => {
            if (!hamburgerMenu.contains(event.target) && !navMenu.contains(event.target)) closeMenu();
        });

        navLinks.forEach((link) => link.addEventListener('click', closeMenu));
    </script>
</body>

</html>
