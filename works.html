    <link rel="stylesheet" href="css/fonts.css">
    <script src="js/page-transition.js" defer></script>
    <link href="https://fonts.googleapis.com/css2?family=Anonymous+Pro:wght@700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="works-dot-overlay" aria-hidden="true">
        <span class="works-dot-row" style="--row-delay: 7"></span>
        <span class="works-dot-row" style="--row-delay: 6"></span>
        <span class="works-dot-row" style="--row-delay: 5"></span>
        <span class="works-dot-row" style="--row-delay: 4"></span>
        <span class="works-dot-row" style="--row-delay: 3"></span>
        <span class="works-dot-row" style="--row-delay: 2"></span>
        <span class="works-dot-row" style="--row-delay: 1"></span>
        <span class="works-dot-row" style="--row-delay: 0"></span>
    </div>
    <header>
        <a class="site-logo" href="index.html" aria-label="Go to Home page"><img src="assets/images/logo.png" alt=""></a>
        <button id="hamburger-menu">
            <img src="assets/images/back.png" alt="Menu" id="hamburger-icon">
        </button>
        <nav>
            <ul id="nav-menu"> 
                <li><a href="index.html">HOME</a></li>
                <li><a href="about.html">ABOUT</a></li>
                <li><a href="works.html">WORKS</a></li>
                <li><a href="contact.html" id="contact-link" class="nav-link">CONTACT</a></li>
            </ul>
        </nav>
    </header>
    <main class="works-section" aria-label="Works">
        <section class="work-project work-project-3d" aria-label="3D projects, 2025">
            <p class="work-project-description">(1) 3D projects<br>-2025</p>
            <a class="work-project-link" href="3D.html" aria-label="Explore 3D projects">
                <img src="assets/images/3D.png" alt="3D projects">
            </a>
        </section>

        <section class="work-project work-project-2d" aria-label="2D projects, 2025">
            <p class="work-project-description">(2) 2D projects<br>-2025</p>
            <img src="assets/images/2D.png" alt="2D projects">
        </section>

        <section class="work-project work-project-web" aria-label="Web Development, 2025">
            <p class="work-project-description">(3) Web Development<br>-2025</p>
            <img src="assets/images/coding.png" alt="Web Development">
        </section>
    </main>
    <a class="works-nav-arrow works-nav-arrow-left" href="about.html" aria-label="Go to About page">
        <img src="assets/images/narrow.png" alt="">
    </a>
    <a class="works-nav-arrow works-nav-arrow-right" href="3D.html" aria-label="Go to 3D projects">
        <img src="assets/images/narrow.png" alt="">
    </a>
    <script>
        const hamburgerMenu = document.getElementById('hamburger-menu');
        const hamburgerIcon = document.getElementById('hamburger-icon'); // Icon bên trong nút
        const navMenu = document.getElementById('nav-menu');
        const navLinks = document.querySelectorAll('#nav-menu a');
        const threeDProject = document.querySelector('.work-project-3d .work-project-link');
        const twoDProject = document.querySelector('.work-project-2d');
        const createHoverPreview = (source, volume) => {
            const audio = new Audio(source);
            const previewLength = 3000;
            const fadeLength = 300;
            let fadeFrame;
            let stopTimer;

            audio.preload = 'auto';

            const fade = (targetVolume, duration, onComplete) => {
                window.cancelAnimationFrame(fadeFrame);
                const startVolume = audio.volume;
                const startedAt = performance.now();

                const updateVolume = (now) => {
                    const progress = Math.min((now - startedAt) / duration, 1);
                    audio.volume = startVolume + (targetVolume - startVolume) * progress;

                    if (progress < 1) {
                        fadeFrame = window.requestAnimationFrame(updateVolume);
                    } else if (onComplete) {
                        onComplete();
                    }
                };

                fadeFrame = window.requestAnimationFrame(updateVolume);
            };

            const stop = () => {
                window.clearTimeout(stopTimer);
                if (audio.paused) return;

                fade(0, fadeLength, () => {
                    audio.pause();
                    audio.currentTime = 0;
                });
            };

            const play = () => {
                window.cancelAnimationFrame(fadeFrame);
                window.clearTimeout(stopTimer);
                audio.pause();
                audio.currentTime = 0;
                audio.volume = 0;

                audio.play().then(() => {
                    fade(volume, fadeLength);
                    stopTimer = window.setTimeout(stop, previewLength - fadeLength);
                }).catch(() => {
                    // Browsers may require a user gesture before allowing hover audio.
                });
            };

            return { play, stop };
        };

        const blenderPreview = createHoverPreview('assets/media/audio/blender.mp3', 0.5);
        const mouseClickPreview = createHoverPreview('assets/media/audio/mouse clicking.mp3', 0.5);

        threeDProject.addEventListener('pointerenter', blenderPreview.play);
        threeDProject.addEventListener('pointerleave', blenderPreview.stop);
        threeDProject.addEventListener('focus', blenderPreview.play);
        threeDProject.addEventListener('blur', blenderPreview.stop);
        twoDProject.addEventListener('pointerenter', mouseClickPreview.play);
        twoDProject.addEventListener('pointerleave', mouseClickPreview.stop);

        document.querySelectorAll('.work-project').forEach((project) => {
            project.addEventListener('click', () => project.classList.add('is-selected'));
        });
        
        // Toggle menu
        hamburgerMenu.addEventListener('click', () => {
            navMenu.classList.toggle('show');
            hamburgerMenu.classList.toggle('active');
            document.body.style.overflow = navMenu.classList.contains('show') ? 'hidden' : 'auto';
        
            // Đổi hình ảnh
            if (hamburgerIcon.src.includes('assets/images/back.png')) {
                hamburgerIcon.src = 'assets/images/unlock.png'; // Đổi thành assets/images/unlock.png khi menu mở
            } else {
                hamburgerIcon.src = 'assets/images/back.png'; // Đổi lại thành assets/images/back.png khi menu đóng
            }
        
            console.log('Menu toggled'); // Debug
        });
        
        // Đóng menu khi click bên ngoài
        document.addEventListener('click', (event) => {
            if (!hamburgerMenu.contains(event.target) && !navMenu.contains(event.target)) {
                navMenu.classList.remove('show');
                hamburgerMenu.classList.remove('active');
                document.body.style.overflow = 'auto';
        
                // Reset hình ảnh về assets/images/back.png khi menu đóng
                hamburgerIcon.src = 'assets/images/back.png';
        
                console.log('Clicked outside menu'); // Debug
            }
        });
        
        // Đóng menu khi click vào link
        navLinks.forEach((link) => {
            link.addEventListener('click', () => {
                navMenu.classList.remove('show');
                hamburgerMenu.classList.remove('active');
                document.body.style.overflow = 'auto';
        
                // Reset hình ảnh về assets/images/back.png khi menu đóng
                hamburgerIcon.src = 'assets/images/back.png';
        
                console.log('Link clicked, menu closed'); // Debug
            });
        });
        
       
            </script>
</body>

</html>
