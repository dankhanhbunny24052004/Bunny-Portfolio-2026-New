    <script src="js/script.js"></script>
    <script>
const hamburgerMenu = document.getElementById('hamburger-menu');
const hamburgerIcon = document.getElementById('hamburger-icon'); // Icon bên trong nút
const navMenu = document.getElementById('nav-menu');
const navLinks = document.querySelectorAll('#nav-menu a');

// Toggle menu
hamburgerMenu.addEventListener('click', () => {
    navMenu.classList.toggle('show');
    hamburgerMenu.classList.toggle('active');
    document.body.style.overflow = navMenu.classList.contains('show') ? 'hidden' : 'auto';

    // Đổi hình ảnh
    if (hamburgerIcon.src.includes('assets/images/back.png')) {
        hamburgerIcon.src = 'assets/images/unlock.png'; // Đổi thành assets/images/unlock.png khi menu mở
    } else {
        hamburgerIcon.src = 'assets/images/back.png'; // Đổi lại thành assets/images/back.png khi menu đóng
    }

    console.log('Menu toggled'); // Debug
});

// Đóng menu khi click bên ngoài
document.addEventListener('click', (event) => {
    if (!hamburgerMenu.contains(event.target) && !navMenu.contains(event.target)) {
        navMenu.classList.remove('show');
        hamburgerMenu.classList.remove('active');
        document.body.style.overflow = 'auto';

        // Reset hình ảnh về assets/images/back.png khi menu đóng
        hamburgerIcon.src = 'assets/images/back.png';

        console.log('Clicked outside menu'); // Debug
    }
});

// Đóng menu khi click vào link
navLinks.forEach((link) => {
    link.addEventListener('click', () => {
        navMenu.classList.remove('show');
        hamburgerMenu.classList.remove('active');
        document.body.style.overflow = 'auto';

        // Reset hình ảnh về assets/images/back.png khi menu đóng
        hamburgerIcon.src = 'assets/images/back.png';

        console.log('Link clicked, menu closed'); // Debug
    });
});


    </script>
